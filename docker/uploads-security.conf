# Prevent execution of PHP and other scripts in the WordPress uploads directory.
# This is a defence-in-depth measure — even if a malicious file is somehow
# written to the uploads directory it cannot be executed by Apache.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?i:php|phtml|phar|php3|php4|php5|php7|sh|py|pl|cgi|exe|bat)$">
        Require all denied
    </FilesMatch>
</Directory>
